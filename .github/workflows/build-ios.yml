name: Build Mobile Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - correcoes-analise
    tags:
      - "v*"

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned .ipa (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Versão fixa de propósito. No 3.47 uma atualização do Flutter
          # esvaziou o service worker do PWA sem avisar (c7b7036), e o deploy
          # usa o que vier do canal. Atualize trocando o número aqui, e confira
          # o PWA depois. 3.47.4 é a versão que gerou o site em 12/09.
          flutter-version: 3.47.4
          cache: true

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          flutter --version

      - name: Generate App Icons
        run: python3 scripts/generate_icons.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app (device)
        shell: bash
        run: |
          set -euo pipefail
          echo "Iniciando compilação do iOS para dispositivo sem assinatura..."
          if ! flutter build ios --release --no-codesign --build-number "${{ github.run_number }}"; then
            echo "::warning::flutter build ios falhou ou exigiu equipe Apple. Executando compilação direta via xcodebuild..."
            flutter build ios --config-only --release --no-codesign --build-number "${{ github.run_number }}"
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/ios_derived \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              clean build
            rm -rf build/ios/iphoneos/Runner.app
            mkdir -p build/ios/iphoneos
            cp -R build/ios_derived/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/Runner.app
          fi

      - name: Package unsigned IPA (Payload)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          mkdir -p dist
          zip -qr dist/caixa-posto-janjao.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: caixa-posto-janjao-ipa
          path: dist/caixa-posto-janjao.ipa
          if-no-files-found: error
          retention-days: 30

  build-apk:
    name: Build .apk (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Versão fixa de propósito. No 3.47 uma atualização do Flutter
          # esvaziou o service worker do PWA sem avisar (c7b7036), e o deploy
          # usa o que vier do canal. Atualize trocando o número aqui, e confira
          # o PWA depois. 3.47.4 é a versão que gerou o site em 12/09.
          flutter-version: 3.47.4
          cache: true

      - name: Configure Flutter Android Platform
        run: |
          # A pasta android/ é versionada (permissão de INTERNET, nome do app e
          # applicationId já estão no repositório). O `flutter create` aqui só
          # completa arquivos faltantes; compileSdk/minSdk vêm do próprio Flutter
          # e NÃO devem ser fixados na mão — travar em 34/21 quebra share_plus,
          # sqflite_android e printing.
          flutter create . --org com.postojanjao --project-name caixa_posto_janjao --platforms android
          echo "── AndroidManifest ──"
          cat android/app/src/main/AndroidManifest.xml

      - name: Generate App Icons
        run: |
          python3 -m pip install pillow --break-system-packages --quiet || true
          python3 scripts/generate_icons.py

      - name: Install dependencies
        run: flutter pub get

      # Assina o APK com a chave oficial do posto quando os secrets estiverem
      # configurados. Sem eles o build continua saindo (com a chave de debug),
      # mas esse APK NÃO instala por cima de uma versão anterior assinada com
      # outra chave — e desinstalar apaga o banco local de turnos.
      #
      # Secrets necessários no repositório:
      #   ANDROID_KEYSTORE_BASE64  -> base64 -w0 upload-keystore.jks
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_PASSWORD
      #   ANDROID_KEY_ALIAS
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 ausente — o APK sairá assinado com a chave de DEBUG e não substituirá instalações anteriores."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          PROPS
          echo "Assinatura de release configurada."

      - name: Build APK
        run: flutter build apk --release --build-number "${{ github.run_number }}"

      # Informativo: imprime o certificado do APK para conferir, no log da
      # execução, se ele saiu com a chave do posto ou com a de debug. Nunca
      # derruba o build — o APK já está pronto neste ponto.
      - name: Show APK signing certificate
        continue-on-error: true
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BUILD_TOOLS" ] && [ -x "$BUILD_TOOLS/apksigner" ]; then
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          else
            echo "apksigner não encontrado — verificação de assinatura ignorada."
          fi

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: Collect APK output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/caixa-posto-janjao.apk
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: caixa-posto-janjao-apk
          path: dist/caixa-posto-janjao.apk
          if-no-files-found: error
          retention-days: 30
