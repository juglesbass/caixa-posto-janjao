name: Build Mobile Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned .ipa (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          flutter --version

      - name: Configure Flutter iOS Platform
        run: flutter create . --org com.postojanjao --project-name caixa_posto_janjao --platforms ios

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build unsigned iOS app (device)
        run: flutter build ios --release --no-codesign --build-number "${{ github.run_number }}"

      - name: Package unsigned IPA (Payload)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          mkdir -p dist
          zip -qr dist/caixa-posto-janjao.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: caixa-posto-janjao-ipa
          path: dist/caixa-posto-janjao.ipa
          if-no-files-found: error
          retention-days: 30

  build-apk:
    name: Build .apk (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter Android Platform
        run: |
          flutter create . --org com.postojanjao --project-name caixa_posto_janjao --platforms android
          
          # Forçar compileSdkVersion 34 em todos os subprojetos
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF

          # Ajustar app/build.gradle
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Collect APK output
        shell: bash
        run: |
          mkdir -p dist
          APK_FILE=$(find . -name "*release*.apk" -o -name "app-release.apk" -o -name "*.apk" | head -n 1)
          echo "Encontrado APK em: $APK_FILE"
          cp "$APK_FILE" dist/caixa-posto-janjao.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: caixa-posto-janjao-apk
          path: dist/caixa-posto-janjao.apk
          if-no-files-found: error
          retention-days: 30
