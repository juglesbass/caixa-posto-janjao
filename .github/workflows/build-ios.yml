name: Build Mobile Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned .ipa (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          flutter --version

      - name: Configure Flutter iOS Platform
        run: |
          # A pasta ios/ é versionada: o `flutter create` aqui só completa o que
          # porventura falte, sem sobrescrever o Info.plist do repositório.
          flutter create . --org com.postojanjao --project-name caixa_posto_janjao --platforms ios

      - name: Generate App Icons
        run: python3 scripts/generate_icons.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app (device)
        run: flutter build ios --release --no-codesign --build-number "${{ github.run_number }}"

      - name: Package unsigned IPA (Payload)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          mkdir -p dist
          zip -qr dist/caixa-posto-janjao.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: caixa-posto-janjao-ipa
          path: dist/caixa-posto-janjao.ipa
          if-no-files-found: error
          retention-days: 30

  build-apk:
    name: Build .apk (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter Android Platform
        run: |
          # A pasta android/ é versionada (permissão de INTERNET, nome do app e
          # applicationId já estão no repositório). O `flutter create` aqui só
          # completa arquivos faltantes; compileSdk/minSdk vêm do próprio Flutter
          # e NÃO devem ser fixados na mão — travar em 34/21 quebra share_plus,
          # sqflite_android e printing.
          flutter create . --org com.postojanjao --project-name caixa_posto_janjao --platforms android
          echo "── AndroidManifest ──"
          cat android/app/src/main/AndroidManifest.xml

      - name: Generate App Icons
        run: |
          python3 -m pip install pillow --break-system-packages --quiet || true
          python3 scripts/generate_icons.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-number "${{ github.run_number }}"

      - name: Collect APK output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/caixa-posto-janjao.apk
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: caixa-posto-janjao-apk
          path: dist/caixa-posto-janjao.apk
          if-no-files-found: error
          retention-days: 30
