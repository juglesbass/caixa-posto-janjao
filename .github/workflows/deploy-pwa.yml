name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # O sqlite3.wasm é versionado em web/ e precisa ser exatamente o da versão
      # que o sqflite_common_ffi_web espera (gerado por
      # `dart run sqflite_common_ffi_web:setup`). Baixar de uma release fixa era
      # a causa raiz do PWA quebrado: a URL apontava para outra versão do sqlite3
      # e o `|| true` engolia qualquer falha de download, publicando um app em
      # que nenhum lançamento era gravado.
      - name: Verify web SQLite binaries
        run: |
          set -euo pipefail
          for f in web/sqlite3.wasm web/sqflite_sw.js; do
            if [ ! -s "$f" ]; then
              echo "::error::$f ausente ou vazio. Rode 'dart run sqflite_common_ffi_web:setup' e faça commit do resultado."
              exit 1
            fi
            echo "OK: $f ($(stat -c%s "$f") bytes)"
          done

      - name: Build Web PWA
        run: flutter build web --release --base-href "/caixa-posto-janjao/"

      - name: Verify build output
        run: |
          set -euo pipefail
          for f in build/web/sqlite3.wasm build/web/index.html build/web/manifest.json; do
            if [ ! -s "build/web/$(basename "$f")" ] && [ ! -s "$f" ]; then
              echo "::error::$f não foi gerado — o PWA seria publicado quebrado."
              exit 1
            fi
          done
          ls -la build/web/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
