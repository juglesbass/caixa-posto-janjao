name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup SQLite Web WASM and Worker
        run: |
          dart run sqflite_common_ffi_web:setup --force || true
          ls -la web/ || true

      - name: Build Web PWA
        run: flutter build web --release --base-href "/caixa-posto-janjao/"

      - name: Ensure SQLite WASM and Worker in build/web
        run: |
          if [ -f "web/sqlite3.wasm" ]; then
            cp -f web/sqlite3.wasm build/web/
          fi
          if [ -f "web/sqflite_sw.js" ]; then
            cp -f web/sqflite_sw.js build/web/
          fi
          ls -la build/web/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
