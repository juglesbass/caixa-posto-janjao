name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # O sqlite3.wasm é versionado em web/ e precisa ser exatamente o da versão
      # que o sqflite_common_ffi_web espera (gerado por
      # `dart run sqflite_common_ffi_web:setup`). Baixar de uma release fixa era
      # a causa raiz do PWA quebrado: a URL apontava para outra versão do sqlite3
      # e o `|| true` engolia qualquer falha de download, publicando um app em
      # que nenhum lançamento era gravado.
      - name: Verify web SQLite binaries
        run: |
          set -euo pipefail
          for f in web/sqlite3.wasm web/sqflite_sw.js; do
            if [ ! -s "$f" ]; then
              echo "::error::$f ausente ou vazio. Rode 'dart run sqflite_common_ffi_web:setup' e faça commit do resultado."
              exit 1
            fi
            echo "OK: $f ($(stat -c%s "$f") bytes)"
          done

      - name: Build Web PWA
      # `--pwa-strategy=offline-first` reativa o service worker de precache.
      # Sem ele (o padrão virou `none`) o PWA publicado não guardava nada: o que
      # o navegador descartasse era rebaixado de novo da rede na abertura
      # seguinte — 1,4 MB de `main.dart.js` mais 2,3 MB de CanvasKit. Num iPhone
      # mais fraco, em rede de celular, era isso a demora do primeiro
      # carregamento, e ela voltava toda vez que o Safari limpava o cache. Pior:
      # um caixa que é offline-first por dentro não abria sem internet.
      #
      # `--no-web-resources-cdn` faz o CanvasKit ser servido do próprio site em
      # vez do gstatic. Não é preferência: o service worker do Flutter só guarda
      # arquivos do build, então enquanto o CanvasKit vier de outro domínio ele
      # nunca entra no cache offline. O GitHub Pages serve `.wasm` com gzip
      # (confirmado nos cabeçalhos), então o tamanho continua equivalente.
      #
      # Atenção ao atualizar o Flutter: o service worker dele está marcado como
      # descontinuado e `--pwa-strategy` deve desaparecer em alguma versão
      # futura. Quando o build quebrar por flag desconhecida, o caminho é um
      # service worker próprio em `web/`, não simplesmente remover a flag.
        run: >
          flutter build web --release
          --base-href "/caixa-posto-janjao/"
          --pwa-strategy=offline-first
          --no-web-resources-cdn

      - name: Verify build output
        run: |
          set -euo pipefail
          # O service worker precisa sair com a lista de recursos do build. O
          # que o Flutter gera com `--pwa-strategy=none` é um arquivo de ~800
          # bytes que se desregistra sozinho: publicar aquele de novo devolveria
          # o PWA sem cache nenhum, sem quebrar nada visível.
          sw=build/web/flutter_service_worker.js
          if [ ! -s "$sw" ] || ! grep -q "RESOURCES" "$sw"; then
            echo "::error::$sw saiu sem a lista de recursos — o PWA ficaria sem cache offline."
            exit 1
          fi
          echo "OK: service worker de precache ($(stat -c%s "$sw") bytes)"
          if [ ! -s build/web/canvaskit/canvaskit.wasm ]; then
            echo "::error::canvaskit local ausente — o CanvasKit viria do CDN e ficaria fora do cache offline."
            exit 1
          fi
          echo "OK: canvaskit local ($(stat -c%s build/web/canvaskit/canvaskit.wasm) bytes)"
          for f in build/web/sqlite3.wasm build/web/index.html build/web/manifest.json; do
            if [ ! -s "build/web/$(basename "$f")" ] && [ ! -s "$f" ]; then
              echo "::error::$f não foi gerado — o PWA seria publicado quebrado."
              exit 1
            fi
          done
          ls -la build/web/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
