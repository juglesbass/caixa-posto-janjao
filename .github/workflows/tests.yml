name: Testes Automatizados

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Diagnostic Analyze, Tests and Web Build
        run: |
          flutter analyze > analyze.log 2>&1 || true
          flutter test --reporter expanded > test.log 2>&1 || true
          flutter build web --release --base-href "/caixa-posto-janjao/" > build_web.log 2>&1 || true

      - name: Upload Diagnostic Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-logs
          path: |
            analyze.log
            test.log
            build_web.log

      - name: Run Flutter Tests
        run: flutter test
