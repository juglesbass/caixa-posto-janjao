name: Testes Automatizados

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Diagnostic Analyze and Web Build
        run: |
          flutter analyze > analyze.log 2>&1 || true
          flutter test --reporter expanded > test.log 2>&1 || true
          flutter build web --release --base-href "/caixa-posto-janjao/" > build_web.log 2>&1 || true

      - name: Push logs to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan debug-logs
          git rm -rf . || true
          git add -f analyze.log test.log build_web.log
          git commit -m "debug: logs [skip ci]" || true
          git push -f origin debug-logs || true

      - name: Test Currency Formatter
        run: flutter test test/currency_formatter_test.dart

      - name: Test Drive and Notif
        run: flutter test test/drive_and_notif_test.dart

      - name: Test Produtos Data
        run: flutter test test/produtos_data_test.dart

      - name: Test Validator
        run: flutter test test/validator_test.dart

      - name: Test Models
        run: flutter test test/models_test.dart
